
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coderwanda-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coderwanda
  template:
    metadata:
      labels:
        app: coderwanda
    spec:
      containers:
        - name: coderwanda-container
          image: coderwanda-webapp
          imagePullPolicy: Never
          ports:
            - containerPort: 80
